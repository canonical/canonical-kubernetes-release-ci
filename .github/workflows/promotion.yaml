name: Promote tracks

on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: |-
          If true, it will not promote the revisions, just test which would be promoted
      days_in_edge_risk:
        type: number
        default: 1
        description: |-
          The number of days in edge risk to consider for promotion
      days_in_beta_risk:
        type: number
        default: 3
        description: |-
          The number of days in beta risk to consider for promotion
      days_in_candidate_risk:
        type: number
        default: 5
        description: |-
          The number of days in candidate risk to consider for promotion
      ignore_tracks:
        type: string
        required: false
        description: |-
          A space separated list of tracks to ignore when proposing promotions. Each
          entry is a fullmatch regex, optionally suffixed `:CEILING` (edge, beta, or
          candidate) to cap a track at that risk level instead of freezing it entirely,
          e.g. '1\.36-classic:candidate' holds a track at candidate, never promoting
          it to stable.
      ignore_architectures:
        type: string
        required: false
        description: |-
          A space separated list of architectures to ignore when proposing promotions

  schedule:
    - cron: '0 0 * * *'  # Runs every midnight

permissions:
  contents: read

jobs:
  promotion-proposal:
    runs-on: ubuntu-latest
    outputs:
      proposals: ${{ steps.propose-promotions.outputs.proposals }}
    env:
      LPCREDS_B64: ${{ secrets.LP_CREDS }}
      LPCREDS: ./lp_creds
      ARGS: ''
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version-file: '.python-version'
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv tool install tox --with tox-uv
      - run: 'echo $LPCREDS_B64 | base64 --decode > lp_creds'
      - name: Assemble Dispatch Arguments
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          # Pass dispatch inputs through env vars, never interpolate them into the
          # script text: a crafted input would otherwise execute as shell code.
          DAYS_IN_EDGE_RISK: ${{ inputs.days_in_edge_risk }}
          DAYS_IN_BETA_RISK: ${{ inputs.days_in_beta_risk }}
          DAYS_IN_CANDIDATE_RISK: ${{ inputs.days_in_candidate_risk }}
          IGNORE_TRACKS: ${{ inputs.ignore_tracks }}
          IGNORE_ARCHES: ${{ inputs.ignore_architectures }}
        run: |
          ARGS="$ARGS --days-in-edge-risk $DAYS_IN_EDGE_RISK"
          ARGS="$ARGS --days-in-beta-risk $DAYS_IN_BETA_RISK"
          ARGS="$ARGS --days-in-candidate-risk $DAYS_IN_CANDIDATE_RISK"
          ARGS="$ARGS --ignore-tracks $IGNORE_TRACKS"
          ARGS="$ARGS --ignore-arches $IGNORE_ARCHES"
          echo "ARGS=$ARGS" >> $GITHUB_ENV
      - name: Assemble auto-promotion Arguments
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
            # Ignore the 1.30/31 and flavor tracks for auto-promotion. We don't support them.
            # Hold 1.36-classic and 1.37-classic at candidate: validated manually, never auto-promote to stable.
            ARGS="$ARGS --ignore-tracks ^1\.\d{2}$ ^1\.\d{2}-moonray$ ^1\.30(-.*)?$ ^1\.31(-.*)?$ 1\.36-classic:candidate 1\.37-classic:candidate "
            echo "ARGS=$ARGS" >> $GITHUB_ENV
      - name: Propose Promotions
        id: propose-promotions
        run: |
          # Reference $ARGS as a shell variable rather than expanding ${{ env.ARGS }}
          # into the script text: the ignore-track regexes contain parentheses and
          # backslashes that bash would otherwise mis-parse (syntax error) or strip.
          tox -e runner -- scripts/promote_tracks.py propose --gh-action $ARGS
  test-proposal:
    if: ${{ needs.promotion-proposal.outputs.proposals && needs.promotion-proposal.outputs.proposals != '[]' }}
    needs: promotion-proposal
    name: ${{ matrix.arch }} r${{ matrix.revision }} for ${{matrix.snap-channel}}
    strategy:
      fail-fast: false   # Don't fail the entire matrix if one proposal fails
      matrix:
        include: ${{ fromJson(needs.promotion-proposal.outputs.proposals) }}
    uses: ./.github/workflows/upgrade-proposal-test.yaml
    with:
      branch: ${{ matrix.branch }}
      dry_run: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || github.event_name == 'pull_request'}}
      lxd-images: ${{ toJson(matrix.lxd-images) }}
      next-risk: ${{ matrix.next-risk }}
      proposal-name: ${{ matrix.name }}
      revision: ${{ matrix.revision }}
      runner-labels: ${{ toJson(matrix.runner-labels) }}
      snap-channel: ${{ matrix.snap-channel }}
      upgrade-channels: ${{ toJson(matrix.upgrade-channels) }}
    secrets:
      SNAPSTORE_AUTH_TOKEN: ${{ secrets.SNAPSTORE_AUTH_TOKEN }}
